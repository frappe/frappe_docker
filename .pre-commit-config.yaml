repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py37-plus]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        exclude: ^docs/pnpm-lock\.yaml$
        additional_dependencies:
          - prettier@3.9.6

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^docs/pnpm-lock\.yaml$
        args:
          - -L
          - "ro"

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        language: golang
        additional_dependencies: [mvdan.cc/sh/v3/cmd/shfmt@latest]
        entry: shfmt
        args: [-w]
        types: [shell]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  - repo: local
    hooks:
      - id: hadolint
        name: hadolint
        description: Lint Dockerfiles and Containerfiles with Hadolint
        language: docker_image
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint
        types: [dockerfile]

      - id: validate-compose
        name: validate compose configurations
        description: Validate every supported Docker Compose override combination
        language: system
        entry: python .github/scripts/validate_compose.py
        pass_filenames: false
        files: >-
          (?x)^(
            compose\.yaml|
            example\.env|
            overrides/compose\..*\.yaml|
            tests/compose-configs\.json|
            \.github/scripts/validate_compose\.py
          )$
