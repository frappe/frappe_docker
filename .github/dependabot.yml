version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: images/bench
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /overrides
    schedule:
      interval: weekly
    allow:
      - dependency-name: nginxproxy/acme-companion
      - dependency-name: nginxproxy/nginx-proxy
      - dependency-name: traefik
    groups:
      proxy-images:
        patterns:
          - nginxproxy/acme-companion
          - nginxproxy/nginx-proxy
          - traefik

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
