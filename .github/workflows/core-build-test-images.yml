name: Core / Build and Test Images

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
        description: "'erpnext' or 'frappe'"
      version:
        required: true
        type: string
        description: "Major version, git tags should match 'v{version}.*'; or 'develop'"
      python_version:
        required: true
        type: string
        description: Python Version
      node_version:
        required: true
        type: string
        description: NodeJS Version
    outputs:
      frappe_version:
        description: "Resolved frappe image tag"
        value: ${{ jobs.resolve.outputs.frappe_version }}
      erpnext_version:
        description: "Resolved erpnext image tag"
        value: ${{ jobs.resolve.outputs.erpnext_version }}

permissions:
  contents: read
  security-events: write

jobs:
  resolve:
    name: Resolve Versions
    runs-on: ubuntu-latest
    outputs:
      frappe_version: ${{ steps.resolve.outputs.frappe_version }}
      erpnext_version: ${{ steps.resolve.outputs.erpnext_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image versions
        id: resolve
        run: python3 ./.github/scripts/get_latest_tags.py --repo ${{ inputs.repo }} --version ${{ inputs.version }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: resolve
    services:
      registry:
        image: docker.io/registry:2
        ports:
          - 5000:5000
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          platforms: linux/${{ matrix.arch }}

      - name: Set resolved versions
        run: |
          echo "FRAPPE_VERSION=${{ needs.resolve.outputs.frappe_version }}" >> "$GITHUB_ENV"
          if [ -n "${{ needs.resolve.outputs.erpnext_version }}" ]; then
            echo "ERPNEXT_VERSION=${{ needs.resolve.outputs.erpnext_version }}" >> "$GITHUB_ENV"
          fi

      - name: Set build args
        run: |
          echo "PYTHON_VERSION=${{ inputs.python_version }}" >> "$GITHUB_ENV"
          echo "NODE_VERSION=${{ inputs.node_version }}" >> "$GITHUB_ENV"

      - name: Build
        uses: docker/bake-action@v7.3.0
        with:
          source: .
          push: true
        env:
          REGISTRY_USER: localhost:5000/frappe

      - name: Create Trivy report directory
        run: mkdir -p trivy-results

      - name: Scan base image
        id: trivy_base
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localhost:5000/frappe/base:${{ env.FRAPPE_VERSION }}
          scanners: vuln
          format: sarif
          output: trivy-results/base.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: 0

      - name: Scan build image
        if: ${{ env.ERPNEXT_VERSION != '' }}
        id: trivy_build
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localhost:5000/frappe/build:${{ env.ERPNEXT_VERSION }}
          scanners: vuln
          format: sarif
          output: trivy-results/build.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: 0
          skip-setup-trivy: true

      - name: Scan ERPNext image
        if: ${{ env.ERPNEXT_VERSION != '' }}
        id: trivy_erpnext
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localhost:5000/frappe/erpnext:${{ env.ERPNEXT_VERSION }}
          scanners: vuln
          format: sarif
          output: trivy-results/erpnext.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: 0
          skip-setup-trivy: true

      - name: Upload Trivy report artifact
        if: ${{ always() && hashFiles('trivy-results/*.sarif') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ inputs.version }}-${{ matrix.arch }}
          path: trivy-results/*.sarif
          retention-days: 30

      - name: Add Trivy results to pull request summary
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('trivy-results/*.sarif') != '' }}
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          maximum_results = 50
          reports = sorted(Path("trivy-results").glob("*.sarif"))
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("## Trivy image findings\n\n")
              for report in reports:
                  payload = json.loads(report.read_text(encoding="utf-8"))
                  results = [
                      result
                      for run in payload.get("runs", [])
                      for result in run.get("results", [])
                  ]
                  summary.write(f"### `{report.stem}`: {len(results)} finding(s)\n\n")
                  if not results:
                      summary.write("No fixed HIGH or CRITICAL vulnerabilities found.\n\n")
                      continue

                  for result in results[:maximum_results]:
                      rule = str(result.get("ruleId", "unknown")).replace("`", "")
                      level = str(result.get("level", "warning")).upper()
                      message = " ".join(
                          str(result.get("message", {}).get("text", "No details"))
                          .replace("`", "")
                          .split()
                      )
                      summary.write(f"- **{level}** `{rule}`: {message}\n")

                  if len(results) > maximum_results:
                      hidden = len(results) - maximum_results
                      summary.write(
                          f"\n{hidden} additional finding(s) are available in the "
                          "Trivy SARIF artifact.\n"
                      )
                  summary.write("\n")
          PY

      - name: Upload v16 amd64 build results to code scanning on main
        if: >-
          ${{
            always() &&
            inputs.version == '16' &&
            matrix.arch == 'amd64' &&
            github.ref == 'refs/heads/main' &&
            github.event_name == 'push' &&
            hashFiles('trivy-results/build.sarif') != ''
          }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results/build.sarif
          category: trivy-v16-amd64-build

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements-test.txt

      - name: Test
        run: venv/bin/pytest --color=yes
