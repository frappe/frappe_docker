name: Habibi image

# Собирает layered-образ (frappe + приложения из habibi/apps.json) и пушит
# в ghcr.io. Перенесено из ветки habibi-deploy, пути приведены к habibi/.
#
# Триггеры:
#   push tag v*         — РЕЛИЗ: собрать образ и ВЫКАТИТЬ на прод (job deploy)
#   push в main         — только собрать образ (без выката), если изменился
#                         apps.json, скрипт сборки или сам workflow
#   workflow_dispatch   — вручную из UI (только сборка)
#   repository_dispatch — из репозитория приложения при пуше в его ветку,
#                         тип события habibi-apps-updated (только сборка)
#
# Выкат на прод происходит ТОЛЬКО по тегу v* — job deploy ниже с
# if startsWith(github.ref, 'refs/tags/v'). Пуш в main прод не трогает.
#
# Фильтр paths ниже действует на весь push-триггер, включая пуш тега.
# Поэтому релизный тег ставим на коммит, который затрагивает один из
# перечисленных путей — иначе воркфлоу по тегу может не запуститься
# и выката не будет.

on:
  push:
    branches:
      - main
    paths:
      - habibi/apps.json
      - habibi/build.sh
      - .github/workflows/habibi-image.yml
    tags:
      - 'v*'
  workflow_dispatch:
  repository_dispatch:
    types:
      - habibi-apps-updated

env:
  FRAPPE_BRANCH: version-16

jobs:
  build:
    # Нативный ARM-раннер: прод-сервер — Oracle Ampere (aarch64), и образ
    # обязан быть под ту же архитектуру. На обычном ubuntu-latest (x86)
    # собирался amd64, и docker на сервере отказывался его запускать:
    #   image ... does not provide the specified platform (linux/arm64)
    #
    # ARM-раннеры бесплатны для публичных репозиториев. Сборка нативная,
    # без эмуляции QEMU — иначе bench init со сборкой ассетов растянулся бы
    # на часы.
    #
    # Если появится x86-сервер: сюда добавляется матрица из двух раннеров
    # со сборкой по digest и слиянием в multi-arch манифест отдельной job.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Владелец репозитория — DHI-Partners, с заглавными буквами, а docker
      # требует имя репозитория строго в нижнем регистре:
      #   invalid tag "ghcr.io/DHI-Partners/habibi:16":
      #   repository name must be lowercase
      # Поэтому github.repository_owner подставляем не напрямую, а через tr.
      - name: Resolve image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/habibi" >> "$GITHUB_ENV"
          echo "образ: ghcr.io/${owner}/habibi"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # habibi/apps.json в репозитории содержит только публичные URL. Для
      # приватных приложений положите готовый файл с токеном в секрет
      # APPS_JSON — он перезапишет версию из репозитория и не попадёт
      # в слои образа (передаётся дальше как BuildKit-секрет).
      - name: Resolve apps.json
        env:
          APPS_JSON: ${{ secrets.APPS_JSON }}
        run: |
          if [ -n "$APPS_JSON" ]; then
            printf '%s' "$APPS_JSON" > habibi/apps.json
            echo "apps.json взят из секрета APPS_JSON"
          else
            echo "apps.json взят из репозитория"
          fi
          jq empty habibi/apps.json

      # Слой bench init кешируется по build-args, а секреты в ключ кэша
      # не входят. Без этого шага новые коммиты приложений не попадут
      # в образ: сборка пройдёт «успешно» со старым кодом.
      #
      # Берём фактические SHA всех репозиториев из apps.json. В отличие от
      # $(date +%s) это детерминированно: те же коммиты — тот же ключ кэша
      # (пересборки не будет), новые коммиты — гарантированная пересборка.
      - name: Compute CACHE_BUST from app commits
        id: bust
        run: |
          bust=""
          while read -r url branch; do
            sha=$(git ls-remote "$url" "refs/heads/$branch" | cut -f1)
            if [ -z "$sha" ]; then
              echo "не удалось разрешить $url @ $branch" >&2
              exit 1
            fi
            echo "$url @ $branch -> $sha"
            bust="${bust}${sha}"
          done < <(jq -r '.[] | "\(.url) \(.branch)"' habibi/apps.json)
          echo "value=$(printf '%s' "$bust" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Релизный тег образа = имя git-тега (v1.0.0). Только когда пуш тега;
      # для пуша в main строка пустая, и build-push-action её пропускает.
      # Именно этим тегом deploy помечает .env на сервере — читаемый якорь
      # для отката (v1.0.0, v1.0.1), в отличие от 16-<hash>.
      - name: Release image tag
        id: reltag
        env:
          # Тег с реальными данными идёт через env, а не подставляется прямо
          # в run: имя git-тега может содержать shell-метасимволы
          # ($(), `, ; и т.п.) — так это просто значение переменной, не код.
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "image_tag=${{ env.IMAGE }}:${REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=" >> "$GITHUB_OUTPUT"
          fi

      # Три тега: скользящий :16, неизменяемый :16-<hash> и (для релиза)
      # :vX.Y.Z. В .env на сервере держим версионный — тогда откат это
      # правка CUSTOM_TAG и docker compose up -d, без пересборки.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          push: true
          # Явно, а не по архитектуре раннера: иначе замена раннера молча
          # меняет архитектуру образа, а узнаётся это только на сервере.
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:16
            ${{ env.IMAGE }}:16-${{ steps.bust.outputs.value }}
            ${{ steps.reltag.outputs.image_tag }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            CACHE_BUST=${{ steps.bust.outputs.value }}
          secret-files: |
            apps_json=./habibi/apps.json
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Итоговые теги
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "архитектура: linux/arm64"
          echo "${{ env.IMAGE }}:16"
          echo "${{ env.IMAGE }}:16-${{ steps.bust.outputs.value }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "${{ env.IMAGE }}:${REF_NAME}   <- релиз, поедет на прод"
          fi

  # ВЫКАТ НА ПРОД. Только по git-тегу v* (пуш в main сюда не попадает).
  # Заходит по SSH на сервер, снимает бэкап, переключает CUSTOM_TAG на
  # имя тега и перезапускает стек. Секреты HABIBI_* — в настройках репозитория.
  deploy:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.HABIBI_HOST }}
          username: ${{ secrets.HABIBI_USER }}
          key: ${{ secrets.HABIBI_SSH_KEY }}
          # Имя тега идёт на сервер как env, а не подставляется в текст
          # script: — иначе тег со спецсимволами ($(), `, ; ...) выполнится
          # как код по SSH с правами деплоя.
          envs: REF_NAME
          script: |
            set -e
            cd ~/habibi_docker

            # Бэкап ПЕРЕД миграцией — обязателен: bench migrate необратим,
            # откат кода образом схему БД назад не вернёт.
            docker compose exec -T backend bench --site all backup

            # Резервная копия .env и переключение на релизный тег.
            cp .env .env.bak-$(date +%Y%m%d-%H%M%S)
            sed -i "s|^CUSTOM_TAG=.*|CUSTOM_TAG=${REF_NAME}|" .env
            grep '^CUSTOM_TAG=' .env

            docker compose pull
            # up -d пересоздаёт контейнеры на новом образе; migrator
            # прогоняет миграции (в .env MIGRATE_SITES=true).
            docker compose up -d
            docker image prune -f

            # Дать backend подняться и проверить, что сайт отвечает.
            sleep 20
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://erp.habibi-erp.com/ || true)
            echo "сайт после выката: HTTP $code"
            test "$code" = "200"
