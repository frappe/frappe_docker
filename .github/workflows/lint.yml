name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test image size checks
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install -r .github/scripts/requirements-image-checks.txt
          python -m unittest discover -s .github/scripts -p 'test_image_sizes.py'

      - name: Check runtime permission layers
        run: python .github/scripts/image_sizes.py guard

      # For shfmt pre-commit hook
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.14"

      - name: Install pre-commit
        run: pip install -U pre-commit

      - name: Lint
        run: pre-commit run --color=always --all-files
        env:
          GO111MODULE: on
