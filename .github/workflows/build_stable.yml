name: Legacy / Build Stable

on:
  workflow_dispatch:
    inputs:
      accept_erpnext_v16_growth:
        description: Accept ERPNext v16 image growth for this run on main
        type: boolean
        default: false

jobs:
  delegate:
    uses: ./.github/workflows/core-build-stable.yml
    with:
      accept_erpnext_v16_growth: ${{ inputs.accept_erpnext_v16_growth }}
    permissions:
      actions: read
      contents: write
      packages: write
      security-events: write
    secrets: inherit
