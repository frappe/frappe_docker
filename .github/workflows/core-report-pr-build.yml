name: Core / Report PR Build

on:
  workflow_run:
    workflows: [Core / Build Stable]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pr-build-report-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      queue: max

    steps:
      - name: Check out the reporter from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Update pull request comment
        run: python3 .github/scripts/report_pr_build.py
        env:
          GH_TOKEN: ${{ github.token }}
