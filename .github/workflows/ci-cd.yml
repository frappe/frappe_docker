name: Build & Push

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─── Required GitHub secrets ────────────────────────────────────────────────
#
# Repository-level (Settings → Secrets → Actions):
#
#   APPS_PAT   Classic PAT (repo scope) for cloning ipstc and ipstc-hrms.
#              Branch mapping is automatic:
#                develop branch  →  ipstc@develop  + ipstc_hrms@develop
#                main branch     →  ipstc@main     + ipstc_hrms@main
#              Injected via BuildKit secret — never baked into the image.
#
# Environment secrets (Settings → Environments → dev / staging):
#
#   SSH_HOST              Server IP or hostname
#   SSH_USER              SSH login user (e.g. root)
#   SSH_KEY               Private SSH key for the server
#   DEPLOY_PATH           Path to frappe-docker on the server (e.g. /opt/frappe-docker)
#   SITE_NAME             Frappe site name (e.g. 167.99.231.229)
#
#   MAIL_SERVER           SMTP hostname (e.g. smtp.gmail.com)
#   MAIL_PORT             SMTP port (default: 587)
#   MAIL_USE_TLS          1 for TLS, 0 for plain (default: 1)
#   MAIL_LOGIN            SMTP username / email address
#   MAIL_PASSWORD         SMTP password or app password
#   MAIL_DEFAULT_SENDER   From address for outgoing mail
#
#              develop branch  →  dev environment
#              main branch     →  staging environment
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image name
        id: image
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Generate apps.json
        id: apps
        env:
          APPS_PAT: ${{ secrets.APPS_PAT }}
        run: |
          CUSTOM_BRANCH=$([[ "${{ github.ref_name }}" == "develop" ]] && echo "develop" || echo "main")

          if [ -n "$APPS_PAT" ]; then
            PREFIX="https://${APPS_PAT}@github.com/TIVOK-SOLUTIONS"
            AUTH_HEADER="Authorization: token ${APPS_PAT}"
          else
            PREFIX="https://github.com/TIVOK-SOLUTIONS"
            AUTH_HEADER=""
          fi

          cat > /tmp/apps.json <<EOF
          [
            {"url": "https://github.com/frappe/erpnext",    "branch": "version-16"},
            {"url": "https://github.com/frappe/hrms",       "branch": "version-16"},
            {"url": "${PREFIX}/ipstc.git",                  "branch": "${CUSTOM_BRANCH}"},
            {"url": "${PREFIX}/ipstc-hrms.git",             "branch": "${CUSTOM_BRANCH}"}
          ]
          EOF

          IPSTC_SHA=$(curl -fsSL -H "${AUTH_HEADER}" \
            "https://api.github.com/repos/TIVOK-SOLUTIONS/ipstc/commits/${CUSTOM_BRANCH}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")

          IPSTC_HRMS_SHA=$(curl -fsSL -H "${AUTH_HEADER}" \
            "https://api.github.com/repos/TIVOK-SOLUTIONS/ipstc-hrms/commits/${CUSTOM_BRANCH}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")

          HASH=$(echo "${IPSTC_SHA}${IPSTC_HRMS_SHA}" | sha256sum | cut -d' ' -f1)

          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "apps.json written"
          echo "ipstc SHA: ${IPSTC_SHA}"
          echo "ipstc-hrms SHA: ${IPSTC_HRMS_SHA}"
          echo "cache hash: ${HASH}"

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: images/custom/Containerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            FRAPPE_BRANCH=version-16
            FRAPPE_PATH=https://github.com/frappe/frappe
            CACHE_BUST=${{ steps.apps.outputs.hash }}
          secret-files: |
            apps_json=/tmp/apps.json
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke Test
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installed apps
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image }}:${{ github.sha }}"

          docker pull "$IMAGE"

          docker run --rm --entrypoint bash "$IMAGE" -lc '
            for app in frappe erpnext hrms ipstc ipstc_hrms; do
              dir="/home/frappe/frappe-bench/apps/$app"
              if [ -d "$dir" ]; then
                echo "OK  $app"
              else
                echo "MISSING  $app" >&2
                exit 1
              fi
            done
          '

  deploy:
    name: Deploy
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'develop' && 'dev' || 'staging' }}
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            if [ "${{ github.ref_name }}" = "main" ]; then
              PROXY_OVERRIDE="-f overrides/compose.https.yaml"
            else
              PROXY_OVERRIDE="-f overrides/compose.noproxy.yaml"
            fi

            COMPOSE="docker compose \
              -f compose.yaml \
              -f overrides/compose.mariadb.yaml \
              -f overrides/compose.redis.yaml \
              ${PROXY_OVERRIDE}"

            echo "Pulling latest images..."
            $COMPOSE pull

            echo "Starting containers..."
            $COMPOSE up -d --remove-orphans

            echo "Waiting for MariaDB to be ready..."
            until $COMPOSE exec -T db mariadb -uroot -p"${DB_ROOT_PASSWORD:-123}" -e "SELECT 1" > /dev/null 2>&1; do
              echo "MariaDB not ready, retrying in 5s..."
              sleep 5
            done

            echo "Ensuring DB user exists..."
            SITE_CONFIG="/home/frappe/frappe-bench/sites/${{ secrets.SITE_NAME }}/site_config.json"
            if $COMPOSE exec -T backend test -f "$SITE_CONFIG" 2>/dev/null; then
              DB_NAME=$($COMPOSE exec -T backend python3 -c "import json; c=json.load(open('$SITE_CONFIG')); print(c['db_name'])")
              DB_USER=$($COMPOSE exec -T backend python3 -c "import json; c=json.load(open('$SITE_CONFIG')); print(c.get('db_user', c['db_name']))")
              DB_PASS=$($COMPOSE exec -T backend python3 -c "import json; c=json.load(open('$SITE_CONFIG')); print(c['db_password'])")
              $COMPOSE exec -T db mariadb -uroot -p"${DB_ROOT_PASSWORD:-123}" -e "
                CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASS}';
                ALTER USER '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASS}';
                GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${DB_USER}'@'%';
                FLUSH PRIVILEGES;
              "
              echo "DB user ensured: ${DB_USER}"
            fi

            echo "Stopping workers..."
            $COMPOSE stop queue-short queue-long scheduler

            echo "Running migrations..."
            $COMPOSE exec -T backend bench --site ${{ secrets.SITE_NAME }} migrate

            echo "Clearing cache..."
            $COMPOSE exec -T backend bench --site ${{ secrets.SITE_NAME }} clear-cache
            $COMPOSE exec -T backend bench --site ${{ secrets.SITE_NAME }} clear-website-cache
            $COMPOSE exec -T redis-cache redis-cli FLUSHALL

            echo "Restarting backend..."
            $COMPOSE restart backend websocket

            echo "Restarting services..."
            $COMPOSE start queue-short queue-long scheduler

            echo "Restarting frontend..."
            $COMPOSE stop frontend
            $COMPOSE start frontend

            echo "Deployment complete."