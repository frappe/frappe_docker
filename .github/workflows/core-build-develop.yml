name: Core / Build Develop

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

on:
  workflow_call:
    inputs:
      accept_image_growth:
        type: boolean
        default: false

  pull_request:
    branches:
      - main
    paths:
      - images/production/**
      - overrides/**
      - tests/**
      - compose.yaml
      - docker-bake.hcl
      - example.env
      - .github/workflows/core-build-develop.yml
      - .github/workflows/core-build-test-images.yml
      - .github/workflows/core-publish-images.yml
      - .github/scripts/image_sizes.py
      - .github/scripts/test_image_sizes.py
      - .github/scripts/get_latest_tags.py
      - .github/image-size-policy.json

  schedule:
    # Every Monday at 03:17 UTC
    - cron: "17 3 * * 1"

  workflow_dispatch:
    inputs:
      accept_image_growth:
        description: Allow images to exceed size limits for this run on main
        type: boolean
        default: false

jobs:
  test:
    uses: ./.github/workflows/core-build-test-images.yml
    with:
      repo: erpnext
      version: develop
      python_version: "3.14"
      node_version: "24"
      accept_image_growth: ${{ inputs.accept_image_growth == true }}

  publish:
    if: ${{ github.repository == 'frappe/frappe_docker' && github.event_name != 'pull_request' }}
    needs: test
    uses: ./.github/workflows/core-publish-images.yml
    with:
      repo: erpnext
      frappe_version: ${{ needs.test.outputs.frappe_version }}
      erpnext_version: ${{ needs.test.outputs.erpnext_version }}
      python_version: "3.14"
      node_version: "24"
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
